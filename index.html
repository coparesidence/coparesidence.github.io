<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- segurança: só roda código do próprio site; imagens só dos 2 servidores de mapa -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://server.arcgisonline.com; connect-src 'self'; media-src 'self' blob: data:; worker-src 'self'; manifest-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Copacabana Residence</title>
<meta name="description" content="Rota da portaria até o seu lote no Copacabana Residence">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Copacabana">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=">
<style>
  /* visual inspirado no "CityRoute AR": painel branco arredondado embaixo,
     pílula de manobra no topo, rota verde-azulada, bolinha azul com cone */
  :root{
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --soft:#f1f5f9; --sheet:#ffffff;
    --blue:#2563eb; --teal:#0d9488; --teal2:#14b8a6; --route:#0fb5a6; --danger:#e11d48;
    --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0b1016;color:var(--ink)}
  #map{position:absolute;inset:0}
  .leaflet-container{background:#0b1016;font-family:inherit}
  .leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.6)!important;border-radius:6px 0 0 6px}
  [hidden]{display:none!important}

  /* topo */
  .brandpill,.maneuver,.fab,.toast{position:absolute;z-index:1000;box-shadow:0 8px 28px rgba(15,23,42,.22)}
  .brandpill{top:calc(12px + var(--sat));left:12px;display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-radius:999px;padding:8px 14px 8px 8px;font-size:13px;font-weight:700;letter-spacing:.2px}
  .brandpill .logo{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--teal2),var(--blue));display:grid;place-items:center}
  .maneuver{top:calc(12px + var(--sat));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;
    background:linear-gradient(135deg,#0f766e,#1d4ed8);color:#fff;border-radius:22px;padding:10px 18px 10px 10px;
    min-width:210px;max-width:calc(100% - 24px);animation:drop .35s cubic-bezier(.2,.9,.3,1.3)}
  .maneuver .mi{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
  .maneuver b{display:block;font-size:22px;line-height:1.05}
  .maneuver span{display:block;font-size:13px;line-height:1.25;opacity:.92}
  @keyframes drop{from{opacity:0;transform:translate(-50%,-14px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
  .fab{right:14px;width:48px;height:48px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;cursor:pointer}
  .fundo{position:absolute;z-index:1000;right:14px;display:flex;align-items:center;gap:6px;border:0;border-radius:999px;cursor:pointer;
    background:rgba(255,255,255,.96);padding:9px 13px;font:600 13px/1 inherit;font-family:inherit;color:var(--ink);box-shadow:0 8px 28px rgba(15,23,42,.22)}
  .toast{left:50%;transform:translateX(-50%);top:calc(84px + var(--sat));background:var(--ink);color:#fff;font-size:13px;font-weight:600;
    padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}

  /* painel inferior */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:1000;margin:0 auto;max-width:520px;
    background:var(--sheet);border-radius:26px 26px 0 0;padding:8px 18px calc(18px + var(--sab));
    box-shadow:0 -10px 40px rgba(15,23,42,.28)}
  @media (min-width:560px){ .sheet{bottom:14px;border-radius:26px} }
  .grab{width:38px;height:5px;border-radius:9px;background:#cbd5e1;margin:2px auto 12px}
  .sheet section{animation:fadeup .3s ease}
  @keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .sheet h1{font-size:19px;margin:0 0 12px;letter-spacing:-.2px}

  .search{display:flex;align-items:center;gap:8px;background:var(--soft);border:2px solid transparent;border-radius:18px;padding:6px 6px 6px 14px;transition:border-color .2s}
  .search:focus-within{border-color:var(--teal2);background:#fff}
  .search input{flex:1;min-width:0;border:0;background:transparent;font-size:19px;font-weight:600;color:var(--ink);outline:none;padding:8px 0}
  .search input::placeholder{color:#94a3b8;font-weight:500}
  .search input::-webkit-outer-spin-button,.search input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .search input[type=number]{-moz-appearance:textfield}
  .go{width:50px;height:50px;border-radius:15px;border:0;cursor:pointer;flex:none;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--teal2),var(--blue));box-shadow:0 6px 16px rgba(37,99,235,.35)}
  .err{color:var(--danger);font-size:13px;font-weight:600;margin:8px 4px 0;min-height:0}
  .err:empty{display:none}

  .modos{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:15px;margin:0 0 12px}
  .modo{flex:1;border:0;background:transparent;border-radius:11px;padding:9px 4px;font:600 14px/1 inherit;font-family:inherit;color:var(--muted);
    display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
  .modo svg{stroke:currentColor}
  .modo.on{background:#fff;color:var(--teal);box-shadow:0 2px 10px rgba(15,23,42,.12)}
  .places{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
  .place{border:0;cursor:pointer;background:var(--soft);border-radius:16px;padding:8px 10px;display:flex;align-items:center;gap:10px;text-align:left;
    font-size:14px;font-weight:600;color:var(--ink);font-family:inherit;min-width:0}
  .place .pi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.08);flex:none}

  /* botões com "mola" (inspirado no Elastic Button do naocodei) */
  .press{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
  .press:active{transform:scale(.93);transition-duration:.08s}

  .dest{display:flex;align-items:center;gap:12px}
  .flag{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--teal2),var(--teal));display:grid;place-items:center;flex:none}
  .dtxt{flex:1;min-width:0}
  .dtxt small{display:block;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  .dtxt b{font-size:19px}
  .x{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;display:grid;place-items:center;flex:none}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .stats div{background:var(--soft);border-radius:14px;padding:10px 8px;text-align:center}
  .stats b{display:block;font-size:18px}
  .stats small{color:var(--muted);font-size:11px;font-weight:600}
  .prog{height:6px;border-radius:9px;background:var(--soft);margin-top:12px;overflow:hidden}
  .prog i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--teal2),var(--blue));transition:width .6s ease}
  .nhint{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}

  .arr{text-align:center;padding:4px 0 2px}
  .arr .ok{width:64px;height:64px;border-radius:50%;margin:2px auto 10px;background:linear-gradient(135deg,var(--teal2),var(--teal));display:grid;place-items:center;
    box-shadow:0 10px 26px rgba(13,148,136,.4);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
  .arr p{color:var(--muted);margin:0 0 14px;font-size:15px}
  .primary{width:100%;height:52px;border:0;border-radius:16px;cursor:pointer;color:#fff;font-size:16px;font-weight:700;font-family:inherit;
    background:linear-gradient(135deg,var(--teal2),var(--blue));box-shadow:0 8px 20px rgba(37,99,235,.3)}

  /* marcadores */
  .me{position:relative;width:24px;height:24px}
  .me .dot{position:absolute;inset:4px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .me .halo{position:absolute;inset:-14px;border-radius:50%;background:rgba(37,99,235,.25);animation:pulse 2s ease-out infinite}
  .me .cone{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;
    background:conic-gradient(from -30deg, rgba(37,99,235,.85), rgba(37,99,235,.35) 30deg, rgba(37,99,235,0) 60deg, rgba(37,99,235,0) 300deg, rgba(37,99,235,.35) 330deg, rgba(37,99,235,.85));
    -webkit-mask:radial-gradient(circle, #000 0 22%, rgba(0,0,0,.6) 48%, transparent 72%);mask:radial-gradient(circle, #000 0 22%, rgba(0,0,0,.6) 48%, transparent 72%);transition:transform .4s}
  @keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.3);opacity:0}}
  .pin{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--teal2),var(--teal));border:3px solid #fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .poi{width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.35)}
  .gate{width:16px;height:16px;border-radius:50%;background:#22c55e;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:2000}
</style>
</head>
<body>
<div id="map"></div>

<div class="brandpill" id="brand">
  <span class="logo"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></span>
  Copacabana Residence
</div>

<!-- próxima manobra (só durante a navegação) -->
<div class="maneuver" id="man" hidden>
  <div class="mi" id="manIcon"></div>
  <div><b id="manDist">—</b><span id="manTxt">—</span></div>
</div>
<div class="toast" id="toast"></div>
<button class="fundo press" id="fundo" aria-label="Mostrar mapa de ruas"></button>
<button class="fab press" id="recenter" hidden aria-label="Centralizar em mim">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>

<div class="sheet" id="sheet">
  <div class="grab"></div>

  <!-- 1) escolher o destino -->
  <section id="stChoose">
    <h1>Para onde você vai?</h1>
    <div class="modos" id="modos" role="radiogroup" aria-label="Como você vai">
      <button type="button" class="modo press" data-modo="carro" role="radio">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M3 17v-4l2.2-5.2A2 2 0 0 1 7 6.6h10a2 2 0 0 1 1.8 1.2L21 13v4M3 13h18"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>Carro</button>
      <button type="button" class="modo press" data-modo="moto" role="radio">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M5.5 16.5L10 10h5l3.5 6.5M14 6h3l1.5 4M10 10l-1.5-3H6"/></svg>Moto</button>
      <button type="button" class="modo press" data-modo="pe" role="radio">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M9 21l2-6 3 3v3M7 12l3-4 4 1 2 4 2 1M10 8l-1 5"/></svg>A pé</button>
    </div>
    <form class="search" id="fLote" autocomplete="off">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#0d9488"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      <input id="lote" type="number" min="1" inputmode="numeric" enterkeyhint="go" placeholder="Número do lote">
      <button class="go press" id="go" type="submit" aria-label="Traçar rota">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div class="err" id="err"></div>
    <div class="places" id="places"></div>
  </section>

  <!-- 2) navegando -->
  <section id="stNav" hidden>
    <div class="dest">
      <div class="flag"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M5 21V4h11l-1.5 3.5L16 11H7v10z"/></svg></div>
      <div class="dtxt"><small id="dLabel">Indo para</small><b id="dName">—</b></div>
      <button class="x press" id="som" aria-label="Voz ligada" aria-pressed="true"></button>
      <button class="x press" id="cancel" aria-label="Encerrar rota">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="stats">
      <div><b id="rDist">—</b><small>faltam</small></div>
      <div><b id="rTempo">—</b><small id="rModo">de moto</small></div>
      <div><b id="rEta">—</b><small>chegada</small></div>
    </div>
    <div class="prog"><i id="progBar"></i></div>
    <div class="nhint" id="navHint"></div>
  </section>

  <!-- 3) chegou -->
  <section id="stArr" class="arr" hidden>
    <div class="ok"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>
    <h1>Você chegou!</h1>
    <p id="arrTxt">—</p>
    <button class="primary press" id="again">Nova rota</button>
  </section>
</div>
<canvas id="confetti" hidden></canvas>

<script src="vendor/leaflet/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="></script>
<script src="app.js"></script>
</body>
</html>
